[package]
name = "dnsless-ui"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "dnsless-ui"
path = "src/main.rs"

[dependencies]
dnsless-common = { path = "../common" }
dnsless-server = { path = "../server" }
dnsless-client = { path = "../client" }
egui = "0.29"
eframe = "0.29"
log = "0.4"
env_logger = "0.11"
chrono = { version = "0.4", default-features = false, features = ["clock"] }

[dev-dependencies]
