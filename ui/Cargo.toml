[package]
name = "dnsless-ui"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "dnsless-ui"
path = "src/main.rs"

# wasm-safe deps: `state`/`event`/`views` only need egui + dnsless-common.
[dependencies]
dnsless-common = { path = "../common" }
egui = "0.29"
chrono = { version = "0.4", default-features = false, features = ["clock"] }

# native-only deps: the app/net shell and the CLI binary.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
eframe = "0.29"
dnsless-server = { path = "../server" }
dnsless-client = { path = "../client" }
env_logger = "0.11"
